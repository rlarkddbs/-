<script>

const quizData = [

{
    image:"images/ionic1.png",
    answer:"이온결합",
    explanation:"Na와 Cl은 전자를 주고받아 결합하므로 이온결합입니다."
},

{
    image:"images/covalent1.png",
    answer:"공유결합",
    explanation:"물(H₂O)은 전자를 함께 공유하므로 공유결합입니다."
},

{
    image:"images/covalent2.png",
    answer:"공유결합",
    explanation:"메테인(CH₄)은 전자를 공유하는 공유결합입니다."
},

{
    image:"images/ionic2.png",
    answer:"이온결합",
    explanation:"리튬과 플루오린은 전자를 주고받는 이온결합입니다."
},

{
    image:"images/ionic3.png",
    answer:"이온결합",
    explanation:"MgO는 마그네슘과 산소가 전자를 주고받는 이온결합입니다."
},

{
    image:"images/covalent3.png",
    answer:"공유결합",
    explanation:"CO₂는 탄소와 산소가 전자를 공유하는 공유결합입니다."
},

{
    image:"images/ionic4.png",
    answer:"이온결합",
    explanation:"KBr은 칼륨과 브로민이 전자를 주고받아 결합합니다."
},

{
    image:"images/covalent4.png",
    answer:"공유결합",
    explanation:"NH₃는 질소와 수소가 전자를 공유하는 공유결합입니다."
},

{
    image:"images/ionic5.png",
    answer:"이온결합",
    explanation:"CaCl₂는 칼슘과 염소 사이의 이온결합입니다."
},

{
    image:"images/covalent5.png",
    answer:"공유결합",
    explanation:"O₂는 산소 원자끼리 전자를 공유하는 공유결합입니다."
}

];

let currentQuiz = 0;
let score = 0;

let timeLeft = 90;
let timer;

function formatTime(seconds){

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    if(sec < 10){
        sec = "0" + sec;
    }

    return `${min}:${sec}`;
}

function loadQuiz(){

    clearInterval(timer);

    timeLeft = 90;

    document.getElementById("time").innerText =
        formatTime(timeLeft);

    document.getElementById("bondImage").src =
        quizData[currentQuiz].image;

    document.getElementById("questionTitle").innerText =
        `문제 ${currentQuiz + 1} / ${quizData.length}`;

    document.getElementById("result").innerText = "";
    document.getElementById("explanation").innerText = "";

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("time").innerText =
            formatTime(timeLeft);

        if(timeLeft <= 0){

            clearInterval(timer);

            document.getElementById("result").innerHTML =
                "⏰ 시간 초과!";

            document.getElementById("explanation").innerHTML =
                quizData[currentQuiz].explanation;

            setTimeout(nextQuiz, 2500);
        }

    }, 1000);
}

function checkAnswer(userAnswer){

    clearInterval(timer);

    const correctAnswer = quizData[currentQuiz].answer;

    if(userAnswer === correctAnswer){

        score += 10;

        document.getElementById("score").innerText = score;

        document.getElementById("result").innerHTML =
            "✅ 정답입니다! (+10점)";

    }else{

        document.getElementById("result").innerHTML =
            "❌ 틀렸습니다!";
    }

    document.getElementById("explanation").innerHTML =
        quizData[currentQuiz].explanation;

    setTimeout(nextQuiz, 2500);
}

function nextQuiz(){

    currentQuiz++;

    if(currentQuiz < quizData.length){

        loadQuiz();

    }else{

        endGame();
    }
}

function endGame(){

    document.querySelector(".quiz-box").innerHTML = `

        <h2>🎉 퀴즈 종료!</h2>

        <h3>최종 점수: ${score}점</h3>

        <h3>총 문제 수: ${quizData.length}문제</h3>

        <p>
        ${
            score >= 80
            ? "🏆 완벽합니다!"
            : score >= 50
            ? "👍 잘했습니다!"
            : "📚 조금 더 공부해봅시다!"
        }
        </p>

        <button onclick="restartGame()">
            다시하기
        </button>
    `;
}

function restartGame(){

    currentQuiz = 0;
    score = 0;

    document.querySelector(".quiz-box").innerHTML = `

        <div class="info">
            <div>점수: <span id="score">0</span></div>

            <div class="timer">
                남은 시간: <span id="time">1:30</span>
            </div>
        </div>

        <h2 id="questionTitle"></h2>

        <img id="bondImage" src="" alt="결합 이미지">

        <div>

            <button class="ionic"
                onclick="checkAnswer('이온결합')">

                이온결합

            </button>

            <button class="covalent"
                onclick="checkAnswer('공유결합')">

                공유결합

            </button>

        </div>

        <div id="result"></div>
        <div id="explanation"></div>
    `;

    loadQuiz();
}

loadQuiz();

</script>
